<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Digital Twin 3D Viewer</title>
</head>

<body>
    <!-- UI -->
   <div id="toolbar">
    <div id="ToolsHeader" class="UIHeader">
            Tools   
        <button id="loadMeshButton" class="UIButton">Load Mesh</button>
    </div>
        <input
            type="file"
            id="meshFileInput"
            accept=".glb,.gltf,.obj,.ply"
            hidden>     
        
    <div id="voxelControls">
        <label for="minVoxelSize">
            Min Voxel Size:
            <span id="minVoxelValue">0.01</span>
        </label>

        <input
            type="range" id="minVoxelSize" min="0.005" max="0.25" step="0.005" value="0.01">
        <label for="maxVoxelSize">
            Max Voxel Size:
            <span id="maxVoxelValue">0.10</span>
        </label>

        <input
            type="range" id="maxVoxelSize" min="0.005" max="0.25" step="0.005" value="0.10">
        <label for="voxelGridOpacity">Grid Opacity</label>
            <div class="slider-row">
                <input type="range" id="voxelGridOpacity" min="0" max="1" step="0.01" value="0.15">
                <span id="voxelGridOpacityValue">0.15</span>
            </div>

            <label for="voxelBoundaryColor">Boundary Outline Color</label>
            <input type="color" id="voxelBoundaryColor" value="#00ffff">

            <label for="minVoxelColor">Min Voxel Color</label>
            <input type="color" id="minVoxelColor" value="#2255aa">

            <label for="maxVoxelColor">Max Voxel Color</label>
            <input type="color" id="maxVoxelColor" value="#66ccff">
            <button id="calculateVoxelVolumeButton" class="UIButton">
                Calculate Approx. Volume with Voxels
            </button>
    </div>    
    </div>
    <div id="sceneExplorer">
        <div id="sceneExplorerHeader" class="UIHeader">
            Scene Explorer
            <button id="addVoxelBoundaryButton" class="UIButton">Add Voxel Boundary</button>
        </div>

        <div id="sceneTree"></div>
    </div>
    <div id="app"></div>

    <script
        type="module"
        src="/src/main.js"
    ></script>
</body>
</html>
