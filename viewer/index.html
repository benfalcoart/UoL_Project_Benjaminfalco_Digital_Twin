<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Digital Twin 3D Viewer</title>
</head>

<body>
    <!-- UI -->
    <div id="toolbar">
        <button id="loadMeshButton">Load Mesh</button>

        <input
            type="file"
            id="meshFileInput"
            accept=".glb,.gltf,.obj,.ply"
            hidden
        >
    </div>
    <div id="sceneExplorer">
        <div id="sceneExplorerHeader">
            Scene Explorer
        </div>

        <div id="sceneTree"></div>
    </div>
    <div id="app"></div>

    <script
        type="module"
        src="/src/main.js"
    ></script>
</body>
</html>
